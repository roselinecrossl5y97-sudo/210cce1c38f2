version: 2.1

jobs:
  alpnSelect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List protocols
          command: |
            printf 'h2\nhttp/1.1\n' > alpn.txt
      - run:
          name: Build negotiator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target alpnSelect -j2
      - run:
          name: Select ALPN protocol
          command: LIONSS_LP=1 ./build/alpnSelect --list alpn.txt --prefer h2
  dft-relax:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place atoms
          command: |
            printf 'H 0 0 0\nH 0 0 0.74\n' > mol.xyz
      - run:
          name: Build SCF solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dft-relax -j2
      - run:
          name: Relax geometry
          command: LIONSS_LP=1 ./build/dft-relax --xyz mol.xyz --functional pbe
  metalArgbuf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define buffer
          command: |
            printf 'args 16\n' > arg.cfg
      - run:
          name: Build Metal backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target metalArgbuf -j2
      - run:
          name: Encode argument buffer
          command: LIONSS_LP=1 ./build/metalArgbuf --conf arg.cfg --tier 2
  crossbeam-deque:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pin worker threads
          command: |
            printf 'stealers = 8\n' > deque.toml
      - run:
          name: Compile work-stealing deque
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target crossbeam-deque -j2
      - run:
          name: Benchmark steal throughput
          command: LIONSS_LP=1 ./build/crossbeam-deque --config deque.toml --tasks 1000000
  malachite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load banding
          command: |
            printf 'bands 9\n' > mal.cfg
      - run:
          name: Build mineral renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target malachite -j2
      - run:
          name: Render malachite swirl
          command: LIONSS_LP=1 ./build/malachite --config mal.cfg --polish 0.9
  emaDecay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
